    <!-- Schema.org JSON-LD (FAQPage) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "¿Qué incluye cada paquete?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Cada paquete (Oro, Plata, Bronce) incluye reels con la historia de su criadero, vitrina o menciones en transmisiones en vivo y perfil en el catálogo web oficial de CCCTN."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cómo se paga?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Al enviar el formulario le escribimos por WhatsApp, confirmamos el paquete y le compartimos los medios de pago. Su cupo queda asegurado al confirmarse el pago."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cuándo se publica mi contenido?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Acordamos visita o envío de material y el calendario por escrito antes de empezar."
          }
        },
        {
          "@type": "Question",
          "name": "¿CCCTN vende caballos?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Somos una vitrina; la compraventa se acuerda entre las partes. La subasta tendrá condiciones propias publicadas antes del evento."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cómo funciona la compra colectiva?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Reunimos pedidos por zona, negociamos directamente con proveedores y le escribimos con la propuesta antes de cualquier compra."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cómo participo en la subasta?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Regístrese en la sección Subasta y le notificaremos de primero la fecha oficial, el catálogo de ejemplares y los requisitos."
          }
        }
      ]
    }
