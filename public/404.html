<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página no encontrada · CCCTN Tesoro Nacional</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #0B0B0B;
        color: #F6F3EC;
        font-family: 'Poppins', sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        box-sizing: border-box;
      }
      .flag-bar {
        display: flex;
        width: 100%;
        height: 6px;
        position: fixed;
        top: 0;
        left: 0;
      }
      .flag-yellow { width: 50%; background-color: #F2CD28; }
      .flag-blue { width: 25%; background-color: #283B7B; }
      .flag-red { width: 25%; background-color: #E81C24; }
      h1 {
        font-family: 'Anton', sans-serif;
        font-size: 5rem;
        letter-spacing: 0.05em;
        margin: 0;
        color: #F2CD28;
      }
      h2 {
        font-family: 'Anton', sans-serif;
        font-size: 2rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin: 0.5rem 0 1rem;
      }
      p {
        max-width: 480px;
        color: #A3A3A3;
        margin: 0 auto 2rem;
        padding: 0 1rem;
        line-height: 1.6;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 28px;
        background-color: #F2CD28;
        color: #0B0B0B;
        font-weight: 700;
        border-radius: 9999px;
        text-decoration: none;
        transition: transform 0.2s, background-color 0.2s;
      }
      .btn:hover {
        background-color: #e5bf1d;
        transform: scale(1.02);
      }
    </style>
  </head>
  <body>
    <div class="flag-bar">
      <div class="flag-yellow"></div>
      <div class="flag-blue"></div>
      <div class="flag-red"></div>
    </div>
    <h1>404</h1>
    <h2>Página No Encontrada</h2>
    <p>La página que busca no existe o fue trasladada. Regrese a la vitrina más grande del caballo criollo colombiano.</p>
    <a href="/" class="btn">Volver al Inicio</a>
  </body>
</html>
